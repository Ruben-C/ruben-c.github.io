<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twitch Multi-View for TV</title>
  <style>
    /* ---------------------------------------------------------------- base */
    /* Type scales with viewport height so the same CSS is legible on a 720p
       box and a 4K panel. Everything below is in rem. */
    html {
      font-size: 2.1vh;
      background: #0a0a0d;
      color: #efeff1;
      font-family: 'Roobert', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;

      /* One width for both side panels, so the stage can be shrunk by exactly
         the amount a panel takes — see the #app shift rules below. */
      --panel-w: max(32vw, 22rem);
      --safe-x: 3.5vw;
      --safe-y: 3.5vh;
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; }

    /* Many TVs still crop the edges of the signal. Keep everything inside a
       safe area rather than trusting the panel. */
    #app {
      position: fixed; inset: 0;
      padding: var(--safe-y) var(--safe-x);
      display: flex; flex-direction: column; gap: 1rem;
    }

    /* THE UI NEVER COVERS A PLAYER.
       Anything painted over the player makes Twitch's IntersectionObserver v2
       check report isVisible:false, and Twitch does not merely refuse to start
       — it PAUSES a player that is already running, and never resumes it. A
       full-screen modal scrim over the grid therefore killed all four streams
       the moment the menu opened. So the sidebar and the menu are side panels
       and the stage is shrunk out from under them instead.
       Resizing a tile is free; only RE-PARENTING one reloads its iframe.
       Deliberately not transitioned: the stage must be clear of the panel
       BEFORE the panel slides in, or the overlap pauses the players anyway. */
    #app.shift-left  { padding-left:  calc(var(--panel-w) + 1.5rem); }
    #app.shift-right { padding-right: calc(var(--panel-w) + 1.5rem); }

    /* The focus sink. Holds document.activeElement forever so no cross-origin
       player iframe can ever steal it and swallow the remote. */
    #sink {
      position: fixed; width: 1px; height: 1px;
      opacity: 0; pointer-events: none; border: 0;
    }
    #sink:focus { outline: none; }

    .hidden { display: none !important; }

    /* --------------------------------------------------------------- stage */
    #stage {
      flex: 1; min-height: 0;
      display: grid; gap: 1rem;
    }
    #stage.lay-solo  { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    #stage.lay-2x1   { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    #stage.lay-2x2   { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    /* Three tiles in a 2x2 would leave a hole; let the last one fill the row. */
    #stage.lay-2x2.n-3 .tile:last-child { grid-column: span 2; }

    /* Focus layouts: one large tile plus a rail down the right. The rail row
       count follows the tile count so the rail always fills its column. */
    #stage.lay-focus { grid-template-columns: 3fr 1fr; }
    #stage.lay-focus.n-2 { grid-template-rows: 1fr; }
    #stage.lay-focus.n-3 { grid-template-rows: 1fr 1fr; }
    #stage.lay-focus.n-4 { grid-template-rows: 1fr 1fr 1fr; }
    #stage.lay-focus .tile--big { grid-column: 1; grid-row: 1 / -1; }

    /* ---------------------------------------------------------------- tile
       The styling here is constrained by Twitch's autoplay check, which reads
       Chromium's IntersectionObserver v2 `isVisible` on the player. Measured on
       an Android TV WebView, each of these makes isVisible false — and so
       silently kills autoplay:
         - a `border` on any ancestor of the player
         - `overflow:hidden` together with `border-radius`
         - ANY element painted over the player, even pointer-events:none
       Hence: rings are box-shadow (verified safe), the video is never clipped,
       and the label bar is a real grid row BELOW the video rather than an
       overlay. Do not "tidy" this back into an overlay. */
    .tile {
      position: relative; min-width: 0; min-height: 0;
      display: grid; grid-template-rows: 1fr auto;
      background: #000;
      box-shadow: 0 0 0 0.2rem #26262c;
      transition: box-shadow .12s ease;
    }
    /* Sofa-distance selection: a thin line is invisible from 3 metres, so the
       selected tile gets a thick ring — drawn outside the video, never over it.
       The ring must also stay INSIDE the grid gap: a wider glow spilling onto
       the neighbouring tiles occludes THEIR players, and occlusion is what makes
       Twitch refuse to autoplay. Measured on a Shield: a 3rem glow here stopped
       all three other tiles from ever starting. */
    .tile--sel {
      box-shadow: 0 0 0 0.3rem #a970ff;
      z-index: 2;
    }

    /* The player fills the 1fr row. Nothing may be drawn on top of it. */
    .tile-video { position: relative; min-height: 0; }
    .tile-player { position: absolute; inset: 0; }
    .tile-video iframe { width: 100%; height: 100%; border: 0; display: block; }

    .tile-bar {
      display: flex; align-items: center; gap: .6rem;
      padding: .45rem .7rem; background: #101014;
      font-size: .95rem; font-weight: 600;
    }
    .tile-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tile-badges { margin-left: auto; display: flex; gap: .4rem; flex-shrink: 0; }

    .badge {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .18rem .6rem; border-radius: 999px;
      font-size: .8rem; font-weight: 700; letter-spacing: .02em;
    }
    .badge--audio { background: #00b37e; color: #00120c; }
    .badge--muted { background: rgba(255,255,255,.14); color: #b8b8c0; }
    .badge--q     { background: rgba(255,255,255,.14); color: #d8d8e0; }
    .badge--off   { background: #e33; color: #fff; }

    /* Tile number, for the "which one is 2?" glance. Lives in the bar, not
       over the video — see the tile comment above. */
    .tile-num {
      min-width: 1.7rem; height: 1.7rem; padding: 0 .45rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: .35rem; background: #2f2f37;
      font-size: .95rem; font-weight: 800; flex-shrink: 0;
    }
    .tile--sel .tile-num { background: #a970ff; color: #1a0033; }

    /* Only ever shown when the stream is offline, so there is no autoplay to
       block by covering the player. */
    .tile-offline {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: .5rem; background: #101014; color: #8a8a94;
      font-size: 1.1rem; font-weight: 600;
    }

    /* --------------------------------------------------------------- empty */
    #empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.2rem; text-align: center;
    }
    #empty h1 { font-size: 2.6rem; margin: 0; font-weight: 800; }
    #empty p  { font-size: 1.15rem; margin: 0; color: #adadb8; max-width: 34rem; line-height: 1.5; }

    /* ------------------------------------------------------------- sidebar */
    #sidebar {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: var(--panel-w);
      background: #17171b; border-right: 0.15rem solid #2f2f37;
      padding: var(--safe-y) 1.5rem;
      display: flex; flex-direction: column; gap: .8rem;
      transform: translateX(-102%); transition: transform .18s ease;
      z-index: 20;
    }
    #sidebar.open { transform: translateX(0); }
    /* Applied for a single frame to drop a panel off-screen without animating
       it across the grid — see snapClosedPanels(). */
    #sidebar.snap, #menu.snap { transition: none; }
    #sidebar h2 { font-size: 1.5rem; margin: 0; font-weight: 800; }
    #side-sub { font-size: .9rem; color: #adadb8; margin: 0; }
    #side-list { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: .35rem; }

    .row {
      display: flex; align-items: center; gap: .7rem;
      padding: .65rem .8rem; border-radius: .5rem;
      border: 0.2rem solid transparent;
      font-size: 1rem;
    }
    .row--sel { background: rgba(169,112,255,.16); border-color: #a970ff; }
    .row-dot { width: .7rem; height: .7rem; border-radius: 50%; background: #e91916; flex-shrink: 0; }
    .row--offline .row-dot { background: #4a4a52; }
    .row-main { min-width: 0; flex: 1; }
    .row-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-meta { font-size: .8rem; color: #adadb8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-mark { font-size: 1.2rem; font-weight: 800; color: #a970ff; flex-shrink: 0; }

    /* ---------------------------------------------------------------- menu
       A right-hand panel, mirroring the sidebar — NOT a centred card behind a
       scrim. The old scrim covered the players and paused every stream; see
       the #app shift rules. It is translated off-screen rather than
       display:none so the slide can be animated, and off-screen means it
       paints nothing over the grid. */
    #menu {
      position: fixed; top: 0; bottom: 0; right: 0; z-index: 30;
      width: var(--panel-w);
      background: #17171b; border-left: 0.15rem solid #2f2f37;
      padding: var(--safe-y) 1.5rem;
      display: flex; flex-direction: column;
      transform: translateX(102%); transition: transform .18s ease;
    }
    #menu.open { transform: translateX(0); }
    #menu-card {
      display: flex; flex-direction: column; gap: .35rem;
      min-height: 0; overflow: hidden;
    }
    #menu-title { font-size: 1.4rem; font-weight: 800; margin: 0 0 .8rem; }
    .mi {
      display: flex; align-items: center; gap: .8rem;
      padding: .7rem .9rem; border-radius: .5rem;
      border: 0.2rem solid transparent; font-size: 1.05rem; font-weight: 600;
    }
    .mi--sel { background: rgba(169,112,255,.16); border-color: #a970ff; }
    .mi-val { margin-left: auto; color: #adadb8; font-weight: 600; }
    .mi--danger.mi--sel { background: rgba(227,51,51,.18); border-color: #e33; }

    /* --------------------------------------------------------------- setup */
    #setup {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0d; padding: 3.5vh 3.5vw;
    }
    #setup-card {
      max-width: 46rem; display: flex; flex-direction: column;
      gap: 1rem; align-items: center; text-align: center;
    }
    #setup h1 { font-size: 2.2rem; margin: 0; font-weight: 800; }
    #setup p { font-size: 1.1rem; color: #adadb8; margin: 0; line-height: 1.5; }
    #setup-code {
      font-size: 4.4rem; font-weight: 800; letter-spacing: .5rem;
      padding: 1rem 2rem; border-radius: .8rem;
      background: #17171b; border: 0.2rem solid #a970ff;
      font-family: 'SF Mono', 'Consolas', monospace;
    }
    #setup-url { font-size: 1.5rem; font-weight: 700; color: #efeff1; }
    #setup-actions { display: flex; flex-direction: column; gap: .35rem; width: 26rem; margin-top: .6rem; }

    /* ------------------------------------------------------- hints / toast
       Both live in one strip below the stage, and only ever one is shown. The
       toast used to be `position: fixed; bottom: 8vh`, which floated it over
       the bottom of the tiles — occlusion, and so a 3-second pause of every
       stream every time anything was announced. In flow it can only push the
       stage up, never cover it. The min-height keeps a one-line toast from
       resizing the grid at all. */
    #footer {
      flex-shrink: 0; min-height: 3.4rem;
      display: flex; align-items: center; justify-content: center;
    }
    #hints {
      display: flex; gap: 1.4rem; align-items: center; justify-content: center;
      font-size: .85rem; color: #8a8a94;
    }
    #hints b { color: #d8d8e0; font-weight: 700; }
    #hints span { white-space: nowrap; }

    #toast {
      background: #26262c; border: 0.15rem solid #3f3f47; border-radius: .6rem;
      padding: .6rem 1.4rem; font-size: 1.05rem; font-weight: 600;
      max-width: 80vw; text-align: center;
    }
    #toast.warn { border-color: #e3a133; }
    #toast.err  { border-color: #e33; }
  </style>
</head>
<body>
  <!-- Permanently focused so no player iframe can take the remote. -->
  <button id="sink" aria-hidden="true"></button>

  <div id="app">
    <div id="stage" class="lay-solo"></div>

    <div id="empty">
      <h1>Twitch Multi-View</h1>
      <p id="empty-msg">Press <b>OK</b> to open your channel list.</p>
    </div>

    <!-- One strip, two occupants: the toast replaces the hints while it is up,
         so neither can ever end up painted over a player. -->
    <div id="footer">
      <div id="hints">
        <span><b>OK</b> menu</span>
        <span><b>◀ ▲ ▼ ▶</b> select</span>
        <span><b>Back</b> close</span>
        <span><b>Play/Pause</b> audio</span>
        <span><b>⏩ ⏪</b> layout</span>
      </div>
      <div id="toast" class="hidden"></div>
    </div>
  </div>

  <aside id="sidebar">
    <h2>Channels</h2>
    <p id="side-sub"></p>
    <div id="side-list"></div>
  </aside>

  <!-- Slid off-screen by transform, not display:none — see the #menu CSS. -->
  <div id="menu">
    <div id="menu-card">
      <h3 id="menu-title"></h3>
      <div id="menu-list"></div>
    </div>
  </div>

  <div id="setup" class="hidden">
    <div id="setup-card"></div>
  </div>

  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script src="app.js"></script>
</body>
</html>
